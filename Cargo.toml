[package]
name = "whisper-lrc"
version = "0.1.0"
edition = "2021"
authors = []
description = "Stateless, preemptive audio-to-LRC synchronized lyrics microservice written in Rust"
license = "MIT OR Apache-2.0"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
sha2 = "0.10"
hex = "0.4"

# Whisper.cpp Rust bindings
whisper-rs = "0.14"

# Pure Rust audio decoding (MP3, WAV, FLAC, AAC, etc.)
symphonia = { version = "0.5", features = ["all"] }

# In-memory concurrent LRU cache
moka = { version = "0.12", features = ["future"] }

# HTTP client to fetch models on demand if missing
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }

[features]
default = []
cuda = ["whisper-rs/cuda"]
